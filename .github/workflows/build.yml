          /** Hozir ko'rinib turgan ro'yxat (papka yoki barcha videolar) shu yerga qo'yiladi. */
          object PlayQueue {
              var uris: List<Uri> = emptyList()
              var names: List<String> = emptyList()
              var ids: List<Long> = emptyList()
              var durations: List<Long> = emptyList()
          }

          class PlayerActivity : ComponentActivity() {
              private var exoPlayer: ExoPlayer? = null
              private var title by mutableStateOf("")
              private var showControls by mutableStateOf(true)
              private lateinit var sp: SharedPreferences

              private val subtitlePicker =
                  registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                      if (uri != null) addSubtitle(uri)
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  sp = getSharedPreferences("prefs", MODE_PRIVATE)

                  val uris = PlayQueue.uris
                  val names = PlayQueue.names
                  if (uris.isEmpty()) {
                      finish()
                      return
                  }
                  val start = intent.getIntExtra("start", 0).coerceIn(0, uris.size - 1)

                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  WindowInsetsControllerCompat(window, window.decorView).apply {
                      systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      hide(WindowInsetsCompat.Type.systemBars())
                  }

                  val exo = ExoPlayer.Builder(this).build()
                  val items = uris.mapIndexed { i, u ->
                      MediaItem.Builder()
                          .setUri(u)
                          .setMediaMetadata(MediaMetadata.Builder().setTitle(names.getOrElse(i) { "" }).build())
                          .build()
                  }
                  val startId = PlayQueue.ids.getOrNull(start)
                  val saved = if (startId != null) sp.getLong("pos_$startId", 0L) else 0L
                  exo.setMediaItems(items, start, saved)
                  exo.addListener(object : Player.Listener {
                      override fun onMediaItemTransition(mediaItem: MediaItem?, reason: Int) {
                          title = mediaItem?.mediaMetadata?.title?.toString() ?: ""
                      }

                      override fun onPositionDiscontinuity(
                          oldPosition: Player.PositionInfo,
                          newPosition: Player.PositionInfo,
                          reason: Int
                      ) {
                          if (oldPosition.mediaItemIndex != newPosition.mediaItemIndex) {
                              store(oldPosition.mediaItemIndex, oldPosition.positionMs)
                          }
                      }
                  })
                  title = names.getOrElse(start) { "" }
                  exo.prepare()
                  exo.playWhenReady = true
                  exoPlayer = exo

                  setContent {
                      Box(Modifier.fillMaxSize().background(Color.Black)) {
                          AndroidView(
                              modifier = Modifier.fillMaxSize(),
                              factory = { ctx ->
                                  PlayerView(ctx).apply {
                                      player = exo
                                      setControllerVisibilityListener(
                                          PlayerView.ControllerVisibilityListener { v ->
                                              showControls = v == View.VISIBLE
                                          }
                                      )
                                  }
                              }
                          )
                          if (showControls) {
                              Text(
                                  title,
                                  color = Color.White,
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis,
                                  modifier = Modifier
                                      .align(Alignment.TopStart)
                                      .displayCutoutPadding()
                                      .fillMaxWidth(0.75f)
                                      .padding(16.dp)
                              )
                              IconButton(
                                  onClick = { subtitlePicker.launch(arrayOf("*/*")) },
                                  modifier = Modifier
                                      .align(Alignment.TopEnd)
                                      .displayCutoutPadding()
                                      .padding(8.dp)
                              ) {
                                  Icon(Icons.Filled.Subtitles, "Subtitr qo'shish", tint = Color.White)
                              }
                          }
                      }
                  }
              }

              private fun store(index: Int, posMs: Long) {
                  val id = PlayQueue.ids.getOrNull(index) ?: return
                  val dur = PlayQueue.durations.getOrElse(index) { 0L }
                  val e = sp.edit()
                  if (dur > 0 && posMs > 5_000 && posMs < dur - 10_000) e.putLong("pos_$id", posMs)
                  else e.remove("pos_$id")
                  e.apply()
              }

              private fun displayName(uri: Uri): String {
                  return try {
                      contentResolver.query(uri, null, null, null, null)?.use { c ->
                          val i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (i >= 0 && c.moveToFirst()) c.getString(i) else null
                      } ?: ""
                  } catch (e: Exception) {
                      ""
                  }
              }

              private fun addSubtitle(uri: Uri) {
                  val exo = exoPlayer ?: return
                  val cur = exo.currentMediaItem ?: return
                  val idx = exo.currentMediaItemIndex
                  val pos = exo.currentPosition
                  val n = displayName(uri).lowercase()
                  val mime = when {
                      n.endsWith(".vtt") -> "text/vtt"
                      n.endsWith(".ass") || n.endsWith(".ssa") -> "text/x-ssa"
                      else -> "application/x-subrip"
                  }
                  val sub = MediaItem.SubtitleConfiguration.Builder(uri)
                      .setMimeType(mime)
                      .setLanguage("und")
                      .setSelectionFlags(C.SELECTION_FLAG_DEFAULT)
                      .build()
                  exo.replaceMediaItem(idx, cur.buildUpon().setSubtitleConfigurations(listOf(sub)).build())
                  exo.seekTo(idx, pos)
                  exo.play()
              }

              override fun onStop() {
                  super.onStop()
                  exoPlayer?.let {
                      store(it.currentMediaItemIndex, it.currentPosition)
                      it.pause()
                  }
              }

              override fun onDestroy() {
                  exoPlayer?.release()
                  exoPlayer = null
                  super.onDestroy()
              }
          }
