name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create project
        run: |
          mkdir -p VideoKutubxona && cd VideoKutubxona
          mkdir -p $(dirname 'app/build.gradle.kts')
          cat > 'app/build.gradle.kts' <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "uz.videokutubxona"
              compileSdk = 35

              defaultConfig {
                  applicationId = "uz.videokutubxona"
                  minSdk = 29
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.10.01"))
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("androidx.compose.material:material-icons-extended")
          }
          EOF_FILE
          mkdir -p $(dirname 'app/src/main/AndroidManifest.xml')
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />

              <application
                  android:allowBackup="true"
                  android:label="Video Kutubxona"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p $(dirname 'app/src/main/java/uz/videokutubxona/MainActivity.kt')
          cat > 'app/src/main/java/uz/videokutubxona/MainActivity.kt' <<'EOF_FILE'
          package uz.videokutubxona

          import android.Manifest
          import android.content.ContentUris
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.os.Build
          import android.provider.MediaStore
          import android.util.Size
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Folder
          import androidx.compose.material.icons.filled.KeyboardArrowDown
          import androidx.compose.material.icons.filled.KeyboardArrowUp
          import androidx.compose.material.icons.filled.PlayArrow
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import android.os.Bundle
          import android.net.Uri
          import androidx.core.content.ContextCompat
          import android.content.pm.PackageManager
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.util.Locale

          data class VideoItem(
              val id: Long,
              val uri: Uri,
              val name: String,
              val durationMs: Long,
              val sizeBytes: Long,
              val folder: String
          )

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { MaterialTheme { App() } }
              }
          }

          private fun videoPermission() =
              if (Build.VERSION.SDK_INT >= 33) Manifest.permission.READ_MEDIA_VIDEO
              else Manifest.permission.READ_EXTERNAL_STORAGE

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun App() {
              val ctx = LocalContext.current
              var granted by remember {
                  mutableStateOf(
                      ContextCompat.checkSelfPermission(ctx, videoPermission()) ==
                          PackageManager.PERMISSION_GRANTED
                  )
              }
              val launcher = rememberLauncherForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) { granted = it }

              LaunchedEffect(Unit) { if (!granted) launcher.launch(videoPermission()) }

              Scaffold(topBar = { TopAppBar(title = { Text("Video Kutubxona") }) }) { pad ->
                  Box(Modifier.padding(pad).fillMaxSize()) {
                      if (!granted) {
                          Column(
                              Modifier.align(Alignment.Center).padding(24.dp),
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              Text("Videolarni ko'rsatish uchun ruxsat kerak.")
                              Spacer(Modifier.height(12.dp))
                              Button(onClick = { launcher.launch(videoPermission()) }) {
                                  Text("Ruxsat berish")
                              }
                          }
                      } else {
                          VideoList()
                      }
                  }
              }
          }

          @Composable
          fun VideoList() {
              val ctx = LocalContext.current
              var videos by remember { mutableStateOf<List<VideoItem>?>(null) }
              LaunchedEffect(Unit) {
                  videos = withContext(Dispatchers.IO) { loadVideos(ctx) }
              }

              val list = videos
              if (list == null) {
                  Box(Modifier.fillMaxSize(), Alignment.Center) { CircularProgressIndicator() }
                  return
              }
              if (list.isEmpty()) {
                  Box(Modifier.fillMaxSize(), Alignment.Center) { Text("Video topilmadi") }
                  return
              }

              val groups = remember(list) {
                  list.groupBy { it.folder }.toSortedMap(String.CASE_INSENSITIVE_ORDER)
              }
              var collapsed by remember { mutableStateOf(setOf<String>()) }

              LazyColumn(Modifier.fillMaxSize()) {
                  groups.forEach { (folder, items) ->
                      item(key = "h_$folder") {
                          val isCollapsed = folder in collapsed
                          Row(
                              Modifier
                                  .fillMaxWidth()
                                  .background(MaterialTheme.colorScheme.surfaceVariant)
                                  .clickable {
                                      collapsed = if (isCollapsed) collapsed - folder else collapsed + folder
                                  }
                                  .padding(horizontal = 16.dp, vertical = 12.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Icon(Icons.Filled.Folder, null)
                              Spacer(Modifier.width(12.dp))
                              Text(
                                  folder,
                                  Modifier.weight(1f),
                                  style = MaterialTheme.typography.titleMedium,
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis
                              )
                              Text("${items.size}", style = MaterialTheme.typography.labelLarge)
                              Icon(
                                  if (isCollapsed) Icons.Filled.KeyboardArrowDown
                                  else Icons.Filled.KeyboardArrowUp,
                                  null
                              )
                          }
                      }
                      if (folder !in collapsed) {
                          items(items, key = { it.id }) { VideoRow(it) }
                      }
                  }
              }
          }

          @Composable
          fun VideoRow(v: VideoItem) {
              val ctx = LocalContext.current
              Row(
                  Modifier
                      .fillMaxWidth()
                      .clickable { play(ctx, v) }
                      .padding(horizontal = 16.dp, vertical = 8.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Thumb(v)
                  Spacer(Modifier.width(12.dp))
                  Column(Modifier.weight(1f)) {
                      Text(
                          v.name,
                          style = MaterialTheme.typography.bodyLarge,
                          maxLines = 2,
                          overflow = TextOverflow.Ellipsis
                      )
                      Spacer(Modifier.height(4.dp))
                      Text(
                          "${formatDuration(v.durationMs)}  •  ${formatMb(v.sizeBytes)}",
                          style = MaterialTheme.typography.bodySmall,
                          color = MaterialTheme.colorScheme.onSurfaceVariant
                      )
                  }
              }
          }

          @Composable
          fun Thumb(v: VideoItem) {
              val ctx = LocalContext.current
              var bmp by remember(v.id) { mutableStateOf<Bitmap?>(null) }
              LaunchedEffect(v.id) {
                  bmp = withContext(Dispatchers.IO) {
                      try {
                          ctx.contentResolver.loadThumbnail(v.uri, Size(320, 180), null)
                      } catch (e: Exception) {
                          null
                      }
                  }
              }
              Box(
                  Modifier
                      .width(120.dp)
                      .height(68.dp)
                      .clip(RoundedCornerShape(8.dp))
                      .background(MaterialTheme.colorScheme.surfaceVariant),
                  Alignment.Center
              ) {
                  val b = bmp
                  if (b != null) {
                      Image(
                          b.asImageBitmap(), null,
                          Modifier.fillMaxSize(),
                          contentScale = ContentScale.Crop
                      )
                  } else {
                      Icon(Icons.Filled.PlayArrow, null)
                  }
              }
          }

          fun loadVideos(ctx: Context): List<VideoItem> {
              val out = mutableListOf<VideoItem>()
              val collection = MediaStore.Video.Media.EXTERNAL_CONTENT_URI
              val proj = arrayOf(
                  MediaStore.Video.Media._ID,
                  MediaStore.Video.Media.DISPLAY_NAME,
                  MediaStore.Video.Media.DURATION,
                  MediaStore.Video.Media.SIZE,
                  MediaStore.Video.Media.BUCKET_DISPLAY_NAME
              )
              ctx.contentResolver.query(
                  collection, proj, null, null,
                  "${MediaStore.Video.Media.DATE_ADDED} DESC"
              )?.use { c ->
                  val iId = c.getColumnIndexOrThrow(MediaStore.Video.Media._ID)
                  val iName = c.getColumnIndexOrThrow(MediaStore.Video.Media.DISPLAY_NAME)
                  val iDur = c.getColumnIndexOrThrow(MediaStore.Video.Media.DURATION)
                  val iSize = c.getColumnIndexOrThrow(MediaStore.Video.Media.SIZE)
                  val iBucket = c.getColumnIndexOrThrow(MediaStore.Video.Media.BUCKET_DISPLAY_NAME)
                  while (c.moveToNext()) {
                      val id = c.getLong(iId)
                      out += VideoItem(
                          id = id,
                          uri = ContentUris.withAppendedId(collection, id),
                          name = c.getString(iName) ?: "Nomsiz",
                          durationMs = c.getLong(iDur),
                          sizeBytes = c.getLong(iSize),
                          folder = c.getString(iBucket) ?: "Boshqa"
                      )
                  }
              }
              return out
          }

          fun formatDuration(ms: Long): String {
              val s = ms / 1000
              val h = s / 3600
              val m = (s % 3600) / 60
              val sec = s % 60
              return if (h > 0) String.format(Locale.US, "%d:%02d:%02d", h, m, sec)
              else String.format(Locale.US, "%d:%02d", m, sec)
          }

          fun formatMb(bytes: Long): String =
              String.format(Locale.US, "%.1f MB", bytes / 1024.0 / 1024.0)

          fun play(ctx: Context, v: VideoItem) {
              val i = Intent(Intent.ACTION_VIEW).apply {
                  setDataAndType(v.uri, "video/*")
                  addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
              }
              ctx.startActivity(Intent.createChooser(i, "Ijro etish"))
          }
          EOF_FILE
          mkdir -p $(dirname 'build.gradle.kts')
          cat > 'build.gradle.kts' <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF_FILE
          mkdir -p $(dirname 'gradle.properties')
          cat > 'gradle.properties' <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_FILE
          mkdir -p $(dirname 'gradle/wrapper/gradle-wrapper.properties')
          cat > 'gradle/wrapper/gradle-wrapper.properties' <<'EOF_FILE'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF_FILE
          mkdir -p $(dirname 'settings.gradle.kts')
          cat > 'settings.gradle.kts' <<'EOF_FILE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "VideoKutubxona"
          include(":app")
          EOF_FILE
      - name: Build
        working-directory: VideoKutubxona
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VideoKutubxona-apk
          path: VideoKutubxona/app/build/outputs/apk/debug/*.apk
